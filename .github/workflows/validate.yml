name: Validate application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Inventory ledger tests
        run: bunx vitest run src/lib/inventory-ledger.test.ts src/lib/sale-journal.test.ts
